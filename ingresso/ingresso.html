<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresso</title>
</head>
<body>

    <a href="../index.html">
        <img src="voltar.png" alt="voltar" width="32" height="32">
    </a><br>
      
    <h1><b>Rock in Rio 2026</b></h1>
    <p>Garanta já seu ingresso!</p>
   
    <form>
            <fieldset>
                
                <legend><strong>Dados do comprador</strong></legend>

                <label for="nome"><strong>Nome*</strong></label><br>
                <input type="text" id="nome" name="nome"><br>
               
                <label for="sobrenome"><strong>Sobrenome*</strong></label><br>
                <input type="text" id="nome" name="nome"><br>


                <label for="email"><strong>Email*</strong></label><br>
                <input type="email" id="email" name="email"><br>


                <label for="cpf"><strong>CPF*</strong></label><br>
                <input type="text" id="cpf" name="cpf"><br>
               
                <label for="telefone"><strong>Telefone*</strong></label><br>
                <input type="tel" id="telefone" name="telefone"><br>


                <label for="nascimento"><strong>Data de nascimento*</strong></label><br>
                <input type="date" id="nascimento" name="nascimento"><br>


                <label for="dataEvento"><strong>Data do evento desejado*</strong></label><br>
                <select id="dataEvento" name="dataEvento">

                    <option value="">Selecione</option>
                    <option value="04-09">04/09/2026</option>
                    <option value="05-09">05/09/2026</option>
                    <option value="06-09">06/09/2026</option>
                    <option value="07-09">07/09/2026</option>
                    <option value="11-09">11/09/2026</option>
                    <option value="12-09">12/09/2026</option>
                    <option value="13-09">13/09/2026</option>

                </select><br>


                <label for="tipoIngresso"><strong>Tipo de ingresso:</strong></label><br>

                <select id="tipoIngresso" name="tipoIngresso">

                    <option value="">Selecione</option>
                    <option value="inteira">Inteira</option>
                    <option value="meia">Meia-entrada</option>

                </select><br>

                <label for="quantidade"><strong>Quantidade</strong></label><br>
                <input 
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                max="10"><br><br>
                
                <input 
                type="checkbox"
                id="termos"
                name="termos">
                <label for="termos">
                    <strong>Aceito os termos</strong>
                </label><br>

                <button type="submit">
                    Comprar
                </button>
                <button type="reset">
                    Limpar
                </button>
            </fieldset>
    </form><br>

    
    <footer><i><u>Ingresso.html</u></i> - Feito por Thomás da Silva César</footer>
</body>
</html>
